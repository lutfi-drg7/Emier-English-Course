Open Schedule

<h2 class="news-gr-ttl">Emier News</h2>

<div id="news"></div>

</div>
<a class="wa"
href="https://wa.me/6285178246050"
target="_blank">
<i class="fa-brands fa-whatsapp"></i>

</a>

<script>

db.collection("news")
.orderBy("time","desc")
.onSnapshot((snap)=>{

let html="";

snap.forEach(doc=>{

let d = doc.data();

let tgl = "";

if(d.time){

let dateObj = d.time.seconds
? new Date(d.time.seconds * 1000)
: new Date(d.time);

tgl = dateObj.toLocaleDateString("id-ID",{
day:"numeric",
month:"long",
year:"numeric"
});

}

html += `

<div class="news-card">

<div class="news-img-box">
<img src="${d.image}">
</div>

<h3>${d.title}</h3>

<div class="news-date">${tgl} - Emier</div>

<p class="news-desc">
${d.desc.replace(/\n/g,"<br>")}
</p>

<div class="news-actions">

<button onclick="readNews('${doc.id}')" class="btn-read">
Baca
</button>

<button onclick="copyLink('${doc.id}')" class="btn-copy">
<i class="fa-solid fa-link"></i>
</button>

<span id="copy-${doc.id}" class="copy-msg"></span>

</div>

</div>

`;

});

news.innerHTML = html;

});


function readNews(id){

location.href = "news-detail.html?id=" + id;

}


function copyLink(id){

let url = location.origin + "/news-detail.html?id=" + id;

navigator.clipboard.writeText(url);

let msg = document.getElementById("copy-" + id);

msg.innerText = "Link copied";

setTimeout(()=>{
msg.innerText = "";
},1500);

}

</script>
<script src="script.js"></script>
</body>
</html>
